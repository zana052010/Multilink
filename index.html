<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>zaNna</title>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0B0813;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      position: relative;
    }

    /* ── video background ── */
    .bg-video {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
    }

    .bg-video video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.3;
    }

    /* dark overlay on top of video */
    .bg-video::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(11,8,19,0.4) 0%, rgba(11,8,19,0.85) 100%);
    }

    /* ── card ── */
    .card {
      position: relative;
      z-index: 1;
      width: 320px;
      padding: 2.5rem 2rem;
      border: 1px solid #2E2347;
      border-radius: 16px;
      background: rgba(17, 14, 26, 0.80);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow:
        0 0 60px rgba(124, 58, 237, 0.10),
        0 8px 32px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .nick {
      font-size: 1.75rem;
      font-weight: 700;
      color: #f0ecf9;
      letter-spacing: 0.02em;
    }

    .handle {
      display: block;
      margin-top: 0.35rem;
      font-size: 0.8rem;
      font-weight: 400;
      color: #6b5f85;
      letter-spacing: 0.03em;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin-top: 1.75rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.65rem 1.25rem;
      border: 1px solid #2E2347;
      border-radius: 10px;
      background: rgba(124, 58, 237, 0.08);
      color: #A78BFA;
      font-size: 0.85rem;
      font-weight: 500;
      text-decoration: none;
      transition: background 0.25s, transform 0.2s, border-color 0.25s;
    }

    .btn:hover {
      background: rgba(124, 58, 237, 0.22);
      border-color: #7C3AED;
      transform: translateY(-2px);
    }

    .btn svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <!-- video background -->
  <div class="bg-video">

    </video>
